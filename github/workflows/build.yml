name: Build EXE
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests phonenumbers pyinstaller
      - run: python -m PyInstaller --onefile --noconsole --name GHOST_OSINT osint.py
      - uses: actions/upload-artifact@v4
        with:
          name: GHOST_OSINT_exe
          path: dist/GHOST_OSINT.exe
